name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

jobs:
  syntax-test:
    runs-on: ubuntu-latest
    name: Syntax Test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: split-tests
        name: Run this action
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 5
          split-index: 2
      - run: echo "The output test suite is ${{ steps.split-tests.outputs.test-suite }}"

  smoke-test-default:
    runs-on: ubuntu-latest
    name: Smoke Test Default
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: split-tests
        name: Run this action
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 5
          split-index: 0
      - run: echo "The output test suite is ${{ steps.split-tests.outputs.test-suite }}"

  smoke-test-exclude-glob:
    runs-on: ubuntu-latest
    name: Smoke Test Exclude Glob
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: split-tests
        name: Run this action
        with:
          glob: examples/spec/**/*_spec.rb
          exclude-glob: examples/spec/api/**/t*_spec.rb
          split-total: 5
          split-index: 0
      - run: echo "The output test suite is ${{ steps.split-tests.outputs.test-suite }}"
      - run: |
          if echo "${{ steps.split-tests.outputs.test-suite }}" | grep -q '/token_spec.rb'; then
            echo "token_spec.rb is included in the test-suite, failing the job."
            exit 1
          else
            echo "token_spec.rb is not included in the test-suite, proceeding."
          fi
        name: Check for token_spec.rb

  smoke-test-line:
    runs-on: ubuntu-latest
    name: Smoke Test Line Count
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: split-tests
        name: Run this action
        with:
          line-count: true
          glob: examples/spec/**/*_spec.rb
          split-total: 5
          split-index: 1
      - run: echo "The output test suite is ${{ steps.split-tests.outputs.test-suite }}"

  smoke-test-correctness:
    runs-on: ubuntu-latest
    name: Smoke Test Correctness (partition coverage)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: split-0
        name: Split index 0
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 3
          split-index: 0
      - uses: ./
        id: split-1
        name: Split index 1
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 3
          split-index: 1
      - uses: ./
        id: split-2
        name: Split index 2
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 3
          split-index: 2
      - name: Assert partitions are non-empty, disjoint, and cover the full glob
        env:
          PARTITION_0: ${{ steps.split-0.outputs.test-suite }}
          PARTITION_1: ${{ steps.split-1.outputs.test-suite }}
          PARTITION_2: ${{ steps.split-2.outputs.test-suite }}
        run: |
          set -euo pipefail

          echo "$PARTITION_0" | tr ' ' '\n' | sed '/^$/d' | sort -u > /tmp/p0.txt
          echo "$PARTITION_1" | tr ' ' '\n' | sed '/^$/d' | sort -u > /tmp/p1.txt
          echo "$PARTITION_2" | tr ' ' '\n' | sed '/^$/d' | sort -u > /tmp/p2.txt

          for f in /tmp/p0.txt /tmp/p1.txt /tmp/p2.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::Partition $f is empty - split-total=3 across this fixture repo should never produce an empty partition"
              exit 1
            fi
          done

          OVERLAP=$(cat /tmp/p0.txt /tmp/p1.txt /tmp/p2.txt | sort | uniq -d || true)
          if [ -n "$OVERLAP" ]; then
            echo "::error::Partitions are not disjoint - the following file(s) appear in more than one split-index: $OVERLAP"
            exit 1
          fi

          cat /tmp/p0.txt /tmp/p1.txt /tmp/p2.txt | sort -u > /tmp/union.txt
          find examples/spec -name '*_spec.rb' | sort -u > /tmp/expected.txt

          if ! diff -u /tmp/expected.txt /tmp/union.txt; then
            echo "::error::Union of all partitions does not match the full glob - some file was dropped or invented"
            exit 1
          fi

          echo "OK: $(wc -l < /tmp/expected.txt) files, split into 3 non-empty disjoint partitions with full coverage"

  smoke-test-junit:
    runs-on: ubuntu-latest
    name: Smoke Test JUnit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: gem install rspec_junit_formatter
      - run: mkdir -p tmp/junit/
      - run: rspec --format RspecJunitFormatter --out tmp/junit/rspec.xml
      - uses: ./
        id: split-tests
        name: Run this action
        with:
          junit-path: examples/tmp/junit/rspec.xml
          glob: examples/spec/**/*_spec.rb
          split-total: 5
          split-index: 1
      - run: echo "The output test suite is ${{ steps.split-tests.outputs.test-suite }}"

  smoke-test-working-directory:
    runs-on: ubuntu-latest
    name: Smoke Test Working Directory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: relative
        name: Relative working-directory
        with:
          working-directory: examples
          glob: spec/**/*_spec.rb
          split-total: 1
          split-index: 0
      - uses: ./
        id: absolute
        name: Absolute working-directory
        with:
          working-directory: ${{ github.workspace }}/examples
          glob: spec/**/*_spec.rb
          split-total: 1
          split-index: 0
      - name: Assert output is relative to working-directory and covers the glob
        env:
          RELATIVE: ${{ steps.relative.outputs.test-suite }}
          ABSOLUTE: ${{ steps.absolute.outputs.test-suite }}
        run: |
          set -euo pipefail

          echo "$RELATIVE" | tr ' ' '\n' | sed '/^$/d' | sort -u > /tmp/relative.txt
          echo "$ABSOLUTE" | tr ' ' '\n' | sed '/^$/d' | sort -u > /tmp/absolute.txt
          (cd examples && find spec -name '*_spec.rb' | sort -u) > /tmp/expected.txt

          if [ ! -s /tmp/expected.txt ]; then
            echo "::error::Fixture has no spec files, the test is not testing anything"
            exit 1
          fi

          if ! diff -u /tmp/expected.txt /tmp/relative.txt; then
            echo "::error::Relative working-directory output does not match the files under examples/spec"
            exit 1
          fi

          if ! diff -u /tmp/relative.txt /tmp/absolute.txt; then
            echo "::error::Absolute and relative working-directory outputs differ"
            exit 1
          fi

          if grep -q '^examples/' /tmp/relative.txt; then
            echo "::error::Output paths should be relative to working-directory, not the workspace"
            exit 1
          fi

          echo "OK: $(wc -l < /tmp/expected.txt) files, paths relative to working-directory"

  smoke-test-expected-failures:
    runs-on: ubuntu-latest
    name: Smoke Test Expected Failures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eliotsykes/rspec-rails-examples
          path: examples/
      - uses: ./
        id: missing-working-directory
        name: Nonexistent working-directory
        continue-on-error: true
        with:
          working-directory: examples/does-not-exist
          glob: spec/**/*_spec.rb
          split-total: 2
          split-index: 0
      - uses: ./
        id: index-out-of-range
        name: split-index equal to split-total
        continue-on-error: true
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 2
          split-index: 2
      - uses: ./
        id: zero-total
        name: split-total of zero
        continue-on-error: true
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 0
          split-index: 0
      - uses: ./
        id: control
        name: Control, valid inputs must still pass
        continue-on-error: true
        with:
          glob: examples/spec/**/*_spec.rb
          split-total: 2
          split-index: 1
      - name: Assert each invalid input failed and the control passed
        env:
          MISSING_WORKING_DIRECTORY: ${{ steps.missing-working-directory.outcome }}
          INDEX_OUT_OF_RANGE: ${{ steps.index-out-of-range.outcome }}
          ZERO_TOTAL: ${{ steps.zero-total.outcome }}
          CONTROL: ${{ steps.control.outcome }}
        run: |
          set -euo pipefail
          status=0
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected outcome '$3' but got '$2'"
              status=1
            else
              echo "OK: $1 -> $2"
            fi
          }
          expect "nonexistent working-directory" "$MISSING_WORKING_DIRECTORY" failure
          expect "split-index equal to split-total" "$INDEX_OUT_OF_RANGE" failure
          expect "split-total of zero" "$ZERO_TOTAL" failure
          expect "valid inputs (control)" "$CONTROL" success
          exit "$status"
