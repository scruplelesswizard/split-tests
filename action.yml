name: Split Tests
author: chaosaffe@users.noreply.github.com
description: Splits test suite for parallelization with equal time
inputs:
  split-total:
    description: Total number of instances executing the tests (integer)
    required: true
  split-index:
    description: Index of this instance executing the tests (integer)
    required: true
  glob:
    description: Glob pattern to find test files (default "spec/**/*_spec.rb") (string)
    required: false
    default: spec/**/*_spec.rb
  exclude-glob:
    description: Glob pattern to exclude test files (string)
    required: false
    default: ""
  junit-path:
    description: Path to a JUnit XML report to use for test timings (string)
    required: false
  line-count:
    description: Use line count to estimate test times (boolean)
    required: false
outputs:
  test-suite:
    description: "A subset of tests, based on the the split index and split type"
    value: ${{ steps.split-tests.outputs.test-suite }}
  split-total:
    description: Total number of instances executing the tests
    value: ${{ inputs.split-total }}
  split-index:
    description: Index of this instance executing the tests
    value: ${{ inputs.split-index }}
runs:
  using: composite
  steps:
    - name: Install split_tests
      run: |
        set -euo pipefail
        curl -fL "https://github.com/leonid-shevtsov/split_tests/releases/latest/download/split_tests.linux.gz" | gunzip -v > split_tests
        chmod +x split_tests
      shell: bash
    - name: Split Tests
      id: split-tests
      env:
        SPLIT_TOTAL: ${{ inputs.split-total }}
        SPLIT_INDEX: ${{ inputs.split-index }}
        GLOB: ${{ inputs.glob }}
        EXCLUDE_GLOB_INPUT: ${{ inputs.exclude-glob }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        LINE_COUNT: ${{ inputs.line-count }}
      run: |
        set -euo pipefail

        # setup split type
        if [ -n "$JUNIT_PATH" ]; then
          echo "junit-path set. Splitting based on JUnit timings"
          SPLIT_BY=(-junit -junit-path="$JUNIT_PATH")
        elif [ "$LINE_COUNT" = "true" ]; then
          echo "line-count set. Splitting based on test line count"
          SPLIT_BY=(-line-count)
        else
          echo "No split type arguments set. Using default"
          SPLIT_BY=()
        fi

        EXCLUDE_GLOB=()
        if [ -n "$EXCLUDE_GLOB_INPUT" ]; then
          EXCLUDE_GLOB=(-exclude-glob="$EXCLUDE_GLOB_INPUT")
        fi

        TESTS=$(./split_tests "${SPLIT_BY[@]}" -split-index="$SPLIT_INDEX" -split-total="$SPLIT_TOTAL" -glob="$GLOB" "${EXCLUDE_GLOB[@]}")

        echo "$TESTS"

        {
          echo "test-suite<<SPLIT_TESTS_EOF"
          echo "$TESTS"
          echo "SPLIT_TESTS_EOF"
        } >> "$GITHUB_OUTPUT"
      shell: bash
branding:
  icon: shuffle
  color: orange
